# DOM Cloud deployment script for Dr. Aishu.
#
# Paste into Setup -> Deploy -> "Add a deployment task" for your website.
# See docs/deploy-domcloud.md for the walkthrough and the free-plan caveats.
#
# Design notes:
#   * Passenger runs uvicorn directly (app_start_command) rather than loading a
#     WSGI startup file. FastAPI is ASGI, so this skips a translation layer and
#     matches what the Dockerfile does. This is DomCloud's "Uvicorn (ASGI)" path.
#   * PORT is injected by Passenger, and the app must bind 127.0.0.1: Passenger
#     proxies from loopback, not from a public interface.
#   * The NGINX root is public_html/public, not public_html, so the Python
#     source tree is never served over HTTP. /static is symlinked in so NGINX
#     serves assets directly.
#   * The case database lives in $HOME, outside public_html: `source` wipes
#     public_html on every deploy, and patient data must survive that.
#   * Tesseract cannot be installed (no sudo, no apt on the free plan). Printed
#     text OCR degrades gracefully; see docs/deploy-domcloud.md.

source:
  url: https://github.com/Geetesh3/dr-aishu.git
  type: clone
  branch: feat/external-dataset-sources

features:
  - python stable

nginx:
  root: public_html/public
  passenger:
    enabled: "on"
    app_root: public_html
    app_start_command: env PORT=$PORT python -m uvicorn app.main:app --host 127.0.0.1 --port $PORT
    env_var_list:
      - PYTHONDONTWRITEBYTECODE=1
      - DR_AISHU_DATA_DIR=$HOME/dr_aishu_data

commands:
  # Dependencies. requirements-domcloud.txt omits the notebook/build-only
  # packages (pandas, matplotlib, openpyxl), which the server never imports and
  # which would cost hundreds of MB against the 1.5 GB free-plan storage limit.
  - python -m pip install --user -r requirements-domcloud.txt

  # Document root: static assets only, nothing importable.
  - mkdir -p public
  - ln -sfn ../static public/static

  # Writable runtime state, outside the served tree and outside public_html so
  # it survives the wipe that every deploy performs.
  - mkdir -p $HOME/dr_aishu_data/uploads $HOME/dr_aishu_data/models
